<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sapBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070F2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Outer Border & Background -->
  <rect width="1000" height="700" rx="16" fill="url(#certBg)" />
  <rect x="24" y="24" width="952" height="652" rx="12" fill="#0A0E1A" stroke="#1E293B" stroke-width="2" />
  
  <!-- Guilloche / Certificate Border Accent -->
  <rect x="36" y="36" width="928" height="628" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="12 4" />
  <rect x="42" y="42" width="916" height="616" rx="6" fill="none" stroke="#0070F2" stroke-width="1" stroke-opacity="0.4" />

  <!-- Corner Ornaments -->
  <g fill="url(#goldGrad)">
    <polygon points="46,46 66,46 46,66" />
    <polygon points="954,46 934,46 954,66" />
    <polygon points="46,654 66,654 46,634" />
    <polygon points="954,654 934,654 954,634" />
  </g>

  <!-- SAP Enterprise Logo Header -->
  <g transform="translate(425, 75)">
    <rect width="150" height="48" rx="6" fill="#0070F2" />
    <text x="75" y="34" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="900" letter-spacing="2" text-anchor="middle">SAP</text>
  </g>

  <!-- Official Title -->
  <text x="500" y="165" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">CERTIFICATE OF RECOGNITION</text>
  
  <text x="500" y="205" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">This is to certify that</text>
  
  <!-- Candidate Name -->
  <text x="500" y="260" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" text-anchor="middle">Prathamesh Sawant</text>
  <line x1="280" y1="280" x2="720" y2="280" stroke="url(#goldGrad)" stroke-width="2" />

  <text x="500" y="320" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">has successfully achieved official SAP certification as</text>

  <!-- Certification Name (Exact as in Resume) -->
  <text x="500" y="365" fill="url(#sapBlueGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" text-anchor="middle">SAP Certified Associate – Back-End Developer - ABAP Cloud</text>

  <!-- Verified Technical Competencies Grid -->
  <g transform="translate(140, 405)">
    <rect width="720" height="110" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1" />
    <text x="360" y="24" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">OFFICIALLY VERIFIED SAP CLOUD &amp; ABAP COMPETENCIES</text>
    <text x="360" y="48" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ABAP RESTful Application Programming Model (RAP) • Core Data Services (CDS Views)</text>
    <text x="360" y="70" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ABAP Development Tools (ADT in Eclipse) • Behavior Definitions (BDEF) • EML</text>
    <text x="360" y="92" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SAP S/4HANA Clean Core Extensibility • OData V4 Services &amp; SAP Fiori Elements</text>
  </g>

  <!-- Seal and Signatures -->
  <!-- Left: Issuer -->
  <g transform="translate(180, 560)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1" />
    <text x="90" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Issuing Organization</text>
    <text x="90" y="74" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">SAP</text>
  </g>

  <!-- Center: Golden Seal Badge -->
  <g transform="translate(500, 580)">
    <circle cx="0" cy="0" r="42" fill="#0A0E1A" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 2" />
    <path d="M -12 -12 L 0 -22 L 12 -12 L 18 0 L 12 12 L 0 22 L -12 12 L -18 0 Z" fill="url(#goldGrad)" opacity="0.3" />
    <text x="0" y="-4" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">VERIFIED</text>
    <text x="0" y="10" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">SEP 2026</text>
  </g>

  <!-- Right: Completion Date -->
  <g transform="translate(640, 560)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1" />
    <text x="90" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Completion Date</text>
    <text x="90" y="74" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">September 2026</text>
  </g>
</svg>
