  <text x="740" y="135" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12">Records Fetched: 532 (0.042s via OpenSQL)</text>

  <!-- ALV Grid Table Area -->
  <rect x="20" y="165" width="1160" height="510" rx="6" fill="#0D1322" stroke="#1E293B" stroke-width="1" />
  
  <!-- Header row -->
