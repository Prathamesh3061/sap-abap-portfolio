<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="sapGuiTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="700" rx="16" fill="#070A12" />
  <rect x="0.5" y="0.5" width="1199" height="699" rx="15.5" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- Window Header / SAP GUI Style Menu -->
  <rect x="0" y="0" width="1200" height="42" fill="url(#sapGuiTop)" />
  <circle cx="20" cy="21" r="6" fill="#EF4444" />
  <circle cx="40" cy="21" r="6" fill="#F59E0B" />
  <circle cx="60" cy="21" r="6" fill="#10B981" />
  <text x="85" y="26" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">SAP GUI 7.70 / S4HANA • Program: ZSALES_ORDER_ALV • Transaction: ZSO_DISPLAY</text>

  <!-- Standard SAP Toolbar Icons Simulation -->
  <rect x="20" y="52" width="1160" height="44" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="40" y="79" fill="#0070F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Sales Order Management (Core ABAP ALV Grid)</text>
  
  <!-- ALV Toolbar Action Pills -->
  <g transform="translate(680, 60)">
