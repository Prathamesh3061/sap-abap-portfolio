  <text x="120" y="189" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SALES ORDER (VBELN)</text>
  <text x="290" y="189" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">ORDER DATE (ERDAT)</text>
  <text x="460" y="189" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SOLD-TO PARTY (KUNNR)</text>
  <text x="680" y="189" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">NET VALUE (NETWR)</text>
  <text x="840" y="189" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">CURR (WAERK)</text>
  <text x="960" y="189" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">DELIVERY STATUS</text>
  <text x="1090" y="189" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">ITEMS</text>

  <!-- Row 1 (Highlight Hotspot) -->
  <rect x="20" y="204" width="1160" height="44" fill="#0070F2" fill-opacity="0.12" />
  <line x1="20" y1="248" x2="1180" y2="248" stroke="#1E293B" stroke-width="1" />
  <circle cx="65" cy="226" r="8" fill="#0070F2" />
  <text x="65" y="230" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">➔</text>
  <text x="120" y="231" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-decoration="underline">0005001284</text>
  <text x="290" y="231" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">2025-05-14</text>
  <text x="460" y="231" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Apex Automotive GmbH (1000104)</text>
  <text x="680" y="231" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">142,500.00</text>
  <text x="840" y="231" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">EUR</text>
  <rect x="960" y="215" width="85" height="22" rx="11" fill="#065F46" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
  <text x="1002" y="230" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Delivered</text>
  <text x="1105" y="231" fill="#0070F2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">6 Items</text>

  <!-- Row 2 -->
  <line x1="20" y1="292" x2="1180" y2="292" stroke="#1E293B" stroke-width="1" />
  <circle cx="65" cy="270" r="7" fill="#334155" />
  <text x="120" y="275" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-decoration="underline">0005001285</text>
  <text x="290" y="275" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">2025-05-18</text>
  <text x="460" y="275" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Siemens Energy AG (1000109)</text>
  <text x="680" y="275" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">89,200.00</text>
  <text x="840" y="275" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">EUR</text>
  <rect x="960" y="259" width="85" height="22" rx="11" fill="#854D0E" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1" />
  <text x="1002" y="274" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Open Order</text>
  <text x="1105" y="275" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">3 Items</text>

  <!-- Row 3 -->
  <line x1="20" y1="336" x2="1180" y2="336" stroke="#1E293B" stroke-width="1" />
  <circle cx="65" cy="314" r="7" fill="#334155" />
  <text x="120" y="319" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-decoration="underline">0005001286</text>
  <text x="290" y="319" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">2025-05-22</text>
  <text x="460" y="319" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Roche Diagnostics (1000121)</text>
  <text x="680" y="319" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">210,400.00</text>
  <text x="840" y="319" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">CHF</text>
  <rect x="960" y="303" width="85" height="22" rx="11" fill="#065F46" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
  <text x="1002" y="318" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Delivered</text>
  <text x="1105" y="319" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">8 Items</text>

  <!-- Row 4 -->
  <line x1="20" y1="380" x2="1180" y2="380" stroke="#1E293B" stroke-width="1" />
  <circle cx="65" cy="358" r="7" fill="#334155" />
  <text x="120" y="363" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-decoration="underline">0005001287</text>
  <text x="290" y="363" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">2025-05-25</text>
  <text x="460" y="363" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12">Bayer Pharma (1000140)</text>
  <text x="680" y="363" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">64,000.00</text>
  <text x="840" y="363" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12">EUR</text>
  <rect x="960" y="347" width="85" height="22" rx="11" fill="#854D0E" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1" />
  <text x="1002" y="362" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">In Billing</text>
  <text x="1105" y="363" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">2 Items</text>

  <!-- Interactive ALV Callout Box -->
  <g transform="translate(45, 420)">
    <rect width="1110" height="235" rx="8" fill="#101726" stroke="#0070F2" stroke-width="1.5" />
    <text x="24" y="34" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">TECHNICAL IMPLEMENTATION HIGHLIGHTS (CORE ABAP)</text>

    <!-- Point 1 -->
    <rect x="24" y="52" width="340" height="160" rx="6" fill="#162035" stroke="#334155" stroke-width="1" />
    <text x="40" y="78" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">1. Relational DDIC Tables</text>
    <text x="40" y="102" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Custom tables ZSO_HEADER &amp; ZSO_ITEM</text>
    <text x="40" y="122" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Primary key: VBELN (Header), POSNR (Item)</text>
    <text x="40" y="142" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Foreign key relationships &amp; search helps</text>
    <text x="40" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Currency reference table fields (WAERK)</text>
    <text x="40" y="190" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">DDIC Dictionary Integrity</text>

    <!-- Point 2 -->
    <rect x="385" y="52" width="340" height="160" rx="6" fill="#162035" stroke="#334155" stroke-width="1" />
    <text x="401" y="78" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">2. High-Performance OpenSQL</text>
    <text x="401" y="102" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Optimized database roundtrips</text>
    <text x="401" y="122" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• FOR ALL ENTRIES IN batch retrieval</text>
    <text x="401" y="142" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Memory-optimized internal table types</text>
    <text x="401" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Secondary hashed keys for rapid lookups</text>
    <text x="401" y="190" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">Zero Database Bottlenecks</text>

    <!-- Point 3 -->
    <rect x="746" y="52" width="340" height="160" rx="6" fill="#162035" stroke="#334155" stroke-width="1" />
    <text x="762" y="78" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">3. Interactive ALV Hotspot</text>
    <text x="762" y="102" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Event-driven drill-down interaction</text>
    <text x="762" y="122" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Double-click on VBELN triggers USER_COMMAND</text>
    <text x="762" y="142" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Dynamic field catalog generation</text>
    <text x="762" y="162" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Secondary ALV renders itemized BOM</text>
    <text x="762" y="190" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="11">Seamless Navigation UX</text>
  </g>
</svg>
