    <text x="215" y="18" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Filter ⏚</text>

    <rect x="260" y="0" width="90" height="28" rx="4" fill="#0070F2" fill-opacity="0.2" stroke="#0070F2" stroke-width="1" />
    <text x="305" y="18" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">∑ Subtotals</text>

    <rect x="360" y="0" width="110" height="28" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
