  <!-- Bottom Integrated Panel: ABAP Debugger & Breakpoint Verification (/h Mode) -->
  <rect x="20" y="410" width="1160" height="245" rx="6" fill="#0A0E1A" stroke="#8B5CF6" stroke-width="1.2" />
  
  <rect x="20" y="410" width="1160" height="32" rx="6" fill="#191530" />
  <text x="40" y="431" fill="#C4B5FD" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">
    🐞 ABAP Debugger Active (SE38 • Breakpoint in USER_COMMAND Subroutine)
  </text>
  <text x="960" y="431" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">
    Step by step (F5) • Execute (F6) • Return (F7)
  </text>

  <!-- Code Line with Yellow Debugger Arrow -->
  <g transform="translate(40, 465)" font-family="'JetBrains Mono', monospace" font-size="11">
    <rect x="-10" y="-14" width="700" height="22" fill="#FBBF24" fill-opacity="0.15" />
    <text x="0" y="0" fill="#FBBF24" font-weight="bold">➡ [Line 142]  SELECT * FROM zso_item INTO TABLE @gt_item WHERE vbeln = @lv_selected_vbeln.</text>
    <text x="0" y="24" fill="#9CDCFE">   [Line 143]  IF sy-subrc = 0.</text>
    <text x="0" y="48" fill="#D4D4D4">   [Line 144]    PERFORM display_item_alv.</text>
    <text x="0" y="72" fill="#9CDCFE">   [Line 145]  ELSE.</text>
    <text x="0" y="96" fill="#CE9178">   [Line 146]    MESSAGE 'No items found for sales order' TYPE 'I'.</text>
    <text x="0" y="120" fill="#9CDCFE">   [Line 147]  ENDIF.</text>
  </g>

  <!-- Variable Inspector in Debugger -->
  <rect x="760" y="450" width="400" height="190" rx="4" fill="#111827" stroke="#374151" stroke-width="1" />
  <text x="780" y="475" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">VARIABLES WATCHLIST</text>
  
  <g transform="translate(780, 500)" font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="0" y="0" fill="#94A3B8">lv_selected_vbeln:</text>
    <text x="170" y="0" fill="#34D399" font-weight="bold">'0005001284'</text>

    <text x="0" y="24" fill="#94A3B8">sy-ucomm:</text>
    <text x="170" y="24" fill="#FCD34D" font-weight="bold">'&amp;IC1' (Double-Click)</text>

    <text x="0" y="48" fill="#94A3B8">sy-subrc:</text>
    <text x="170" y="48" fill="#34D399" font-weight="bold">0 (Success)</text>

    <text x="0" y="72" fill="#94A3B8">lines(gt_item):</text>
    <text x="170" y="72" fill="#38BDF8" font-weight="bold">3 Records</text>

    <text x="0" y="96" fill="#94A3B8">s_werks-low:</text>
    <text x="170" y="96" fill="#E2E8F0">'1000'</text>
  </g>

  <!-- SAP GUI Status Bar -->
  <rect x="0" y="665" width="1200" height="35" fill="#141E33" stroke="#334155" stroke-width="0.8" />
  <circle cx="25" cy="682" r="5" fill="#10B981" />
  <text x="38" y="686" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600">
