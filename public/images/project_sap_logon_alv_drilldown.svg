    <text x="640" y="0" fill="#E2E8F0">50 PC</text>
    <text x="770" y="0" fill="#FCD34D">1000</text>
    <text x="880" y="0" fill="#E2E8F0">1,200.00</text>
    <text x="1010" y="0" fill="#38BDF8" font-weight="bold">60,000.00 INR</text>
  </g>

  <!-- Item Row 20 -->
  <line x1="20" y1="258" x2="1180" y2="258" stroke="#1E293B" stroke-width="1" />
  <g transform="translate(40, 244)" font-family="'JetBrains Mono', monospace" font-size="12">
    <text x="0" y="0" fill="#38BDF8" font-weight="bold">000020</text>
    <text x="120" y="0" fill="#E2E8F0">MAT-SNS-401</text>
    <text x="360" y="0" fill="#F8FAFC" font-family="'Inter', sans-serif">Optical Proximity Sensor Harness</text>
    <text x="640" y="0" fill="#E2E8F0">100 PC</text>
    <text x="770" y="0" fill="#FCD34D">1000</text>
    <text x="880" y="0" fill="#E2E8F0">450.00</text>
    <text x="1010" y="0" fill="#38BDF8" font-weight="bold">45,000.00 INR</text>
  </g>

  <!-- Item Row 30 -->
  <line x1="20" y1="301" x2="1180" y2="301" stroke="#1E293B" stroke-width="1" />
  <g transform="translate(40, 287)" font-family="'JetBrains Mono', monospace" font-size="12">
    <text x="0" y="0" fill="#38BDF8" font-weight="bold">000030</text>
    <text x="120" y="0" fill="#E2E8F0">MAT-BRK-108</text>
