    <text x="0" y="22" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">0005001284</text>

    <text x="240" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Customer / Sold-To Party:</text>
    <text x="240" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Apex Automotive (CUST-104)</text>

    <text x="560" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Plant:</text>
    <text x="560" y="22" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">1000 (Mumbai Plant)</text>

    <text x="780" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Order Net Total:</text>
    <text x="780" y="22" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">142,500.00 INR</text>

    <text x="980" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Trigger Event:</text>
    <text x="980" y="22" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="12">Double-Click (&amp;IC1)</text>
  </g>

  <!-- Items Table Area (Custom DDIC table ZSO_ITEM) -->
  <rect x="20" y="137" width="1160" height="260" rx="6" fill="#0D1322" stroke="#1E293B" stroke-width="1" />
  
  <!-- Table Header -->
  <rect x="20" y="137" width="1160" height="34" rx="6" fill="#162035" />
  <line x1="20" y1="171" x2="1180" y2="171" stroke="#334155" stroke-width="1" />
  <g transform="translate(40, 159)" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#94A3B8">
