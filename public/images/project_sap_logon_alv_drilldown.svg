    <text x="120" y="0">MATERIAL NUMBER (MATNR)</text>
    <text x="360" y="0">MATERIAL DESCRIPTION</text>
    <text x="640" y="0">ORDER QTY</text>
    <text x="770" y="0">PLANT</text>
    <text x="880" y="0">UNIT PRICE</text>
    <text x="1010" y="0">NET VALUE</text>
  </g>

