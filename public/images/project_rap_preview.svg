  <rect x="910" y="337" width="86" height="22" rx="11" fill="#854D0E" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1" />
  <text x="953" y="352" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">⏳ In Process</text>
  <text x="1060" y="351" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">View Details →</text>

  <!-- Row 3 -->
  <line x1="24" y1="419" x2="1176" y2="419" stroke="#334155" stroke-width="0.5" />
  <text x="50" y="399" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">TRV-0004130</text>
  <text x="160" y="399" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="12">070001 (Fly Emirates)</text>
  <text x="290" y="399" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">Novartis Pharma (CUST-0023)</text>
  <text x="450" y="399" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">2025-07-12 → 2025-07-20</text>
  <text x="640" y="399" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">50.00 CHF</text>
  <text x="770" y="399" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">1,820.00 CHF</text>
  <!-- Accepted Status Badge -->
  <rect x="910" y="385" width="86" height="22" rx="11" fill="#065F46" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
  <text x="953" y="400" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Accepted</text>
  <text x="1060" y="399" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">View Details →</text>

  <!-- Row 4 -->
  <line x1="24" y1="467" x2="1176" y2="467" stroke="#334155" stroke-width="0.5" />
  <text x="50" y="447" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">TRV-0004131</text>
  <text x="160" y="447" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="12">070008 (Singapore Air)</text>
  <text x="290" y="447" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">Apex Consulting (CUST-0899)</text>
  <text x="450" y="447" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">2025-08-04 → 2025-08-18</text>
  <text x="640" y="447" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">95.00 USD</text>
  <text x="770" y="447" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">3,120.00 USD</text>
  <!-- Rejected Status Badge -->
  <rect x="910" y="433" width="86" height="22" rx="11" fill="#7F1D1D" fill-opacity="0.3" stroke="#EF4444" stroke-width="1" />
  <text x="953" y="448" fill="#F87171" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">✕ Cancelled</text>
  <text x="1060" y="447" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">View Details →</text>

  <!-- Technical Overlay HUD: Showing RAP Architecture -->
  <g transform="translate(44, 520)">
    <rect width="1112" height="135" rx="8" fill="#0A0E1A" stroke="#0070F2" stroke-width="1.2" stroke-dasharray="6 4" />
    <text x="20" y="30" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">ARCHITECTURE STACK: SAP RAP MANAGED SCENARIO</text>
    
    <!-- Step 1 -->
    <rect x="20" y="45" width="250" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="32" y="68" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CDS View Entity</text>
    <text x="32" y="88" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">ZI_Travel_M &amp; ZI_Booking_M</text>
    <text x="32" y="104" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10">Root Composition &amp; Associations</text>

    <!-- Arrow -->
    <path d="M 280 80 L 305 80" stroke="#0070F2" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 2 -->
    <rect x="315" y="45" width="250" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="327" y="68" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Behavior Definition</text>
    <text x="327" y="88" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">BDEF ZI_Travel_M (Managed)</text>
    <text x="327" y="104" fill="#10B981" font-family="'Inter', sans-serif" font-size="10">Validations, Actions &amp; EML Determinations</text>

    <!-- Arrow -->
    <path d="M 575 80 L 600 80" stroke="#0070F2" stroke-width="2" />

    <!-- Step 3 -->
    <rect x="610" y="45" width="250" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="622" y="68" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Service Binding</text>
    <text x="622" y="88" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">ZUI_TRAVEL_O4 (OData V4 - UI)</text>
    <text x="622" y="104" fill="#A855F7" font-family="'Inter', sans-serif" font-size="10">SAP Gateway &amp; Metadata Exposure</text>

    <!-- Arrow -->
    <path d="M 870 80 L 895 80" stroke="#0070F2" stroke-width="2" />

    <!-- Step 4 -->
    <rect x="905" y="45" width="190" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="917" y="68" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Fiori Elements</text>
    <text x="917" y="88" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">List Report &amp; Object Page</text>
    <text x="917" y="104" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10">UI Annotations Driven</text>
  </g>
</svg>
