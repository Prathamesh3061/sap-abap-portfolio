<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003566" />
      <stop offset="100%" stop-color="#001d3d" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0070F2" />
      <stop offset="100%" stop-color="#0052b4" />
    </linearGradient>
    <filter id="subtleDrop" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Window Shell -->
  <rect width="1200" height="700" rx="16" fill="#0A0E1A" />
  <rect x="0.5" y="0.5" width="1199" height="699" rx="15.5" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- SAP Fiori Shell Bar -->
  <rect x="0" y="0" width="1200" height="52" fill="url(#headerGrad)" />
  <!-- SAP Logo Icon -->
  <rect x="24" y="14" width="48" height="24" rx="4" fill="#0070F2" />
  <text x="48" y="31" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">SAP</text>
  <!-- App Title -->
  <text x="86" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">Flight Booking Management</text>
  <rect x="330" y="16" width="130" height="20" rx="10" fill="#0070F2" fill-opacity="0.25" stroke="#0070F2" stroke-width="0.8" />
  <text x="395" y="30" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" text-anchor="middle">SAP RAP Managed</text>
  <!-- User Profile in Shell Bar -->
  <circle cx="1160" cy="26" r="14" fill="#1E293B" stroke="#0070F2" stroke-width="1.5" />
  <text x="1160" y="30" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PS</text>

  <!-- Filter Bar (Fiori SmartFilterBar) -->
  <rect x="24" y="70" width="1152" height="100" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1" />
  <text x="44" y="96" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">FILTERS (CDS SELECTION)</text>
  
  <!-- Filter 1: Agency ID -->
  <text x="44" y="125" fill="#6B7280" font-family="'Inter', sans-serif" font-size="11">Agency ID</text>
  <rect x="44" y="133" width="180" height="28" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1" />
  <text x="56" y="152" fill="#F3F4F6" font-family="'JetBrains Mono', monospace" font-size="12">070001 (Fly Emirates)</text>

  <!-- Filter 2: Customer ID -->
  <text x="244" y="125" fill="#6B7280" font-family="'Inter', sans-serif" font-size="11">Customer ID</text>
  <rect x="244" y="133" width="160" height="28" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1" />
  <text x="256" y="152" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="12">All Customers</text>

  <!-- Filter 3: Travel Status -->
  <text x="424" y="125" fill="#6B7280" font-family="'Inter', sans-serif" font-size="11">Booking Status</text>
  <rect x="424" y="133" width="150" height="28" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1" />
  <text x="436" y="152" fill="#10B981" font-family="'Inter', sans-serif" font-size="12">● Accepted</text>

  <!-- Filter Buttons -->
  <rect x="1010" y="133" width="76" height="28" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1" />
  <text x="1048" y="151" fill="#D1D5DB" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">Adapt</text>
  <rect x="1096" y="133" width="60" height="28" rx="4" fill="url(#btnGrad)" />
  <text x="1126" y="151" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Go</text>

  <!-- Table Container (SmartTable / Fiori List Report) -->
  <rect x="24" y="185" width="1152" height="490" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  
  <!-- Table Header Bar & RAP Actions -->
  <rect x="24" y="185" width="1152" height="52" rx="8" fill="#172239" />
  <text x="44" y="217" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Travel Bookings (CDS View: ZI_Travel_M)</text>
  <text x="360" y="216" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">(248 Total Records)</text>

  <!-- RAP Action Buttons on Toolbar -->
  <rect x="730" y="197" width="80" height="28" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
  <text x="770" y="215" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Accept Travel</text>

  <rect x="820" y="197" width="80" height="28" rx="4" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
  <text x="860" y="215" fill="#F87171" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Reject Travel</text>

  <rect x="910" y="197" width="60" height="28" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="940" y="215" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Create</text>

  <rect x="980" y="197" width="60" height="28" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="1010" y="215" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Delete</text>

  <rect x="1050" y="197" width="110" height="28" rx="4" fill="url(#btnGrad)" />
  <text x="1105" y="215" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ New Booking</text>

  <!-- Table Column Headers -->
