  <rect x="910" y="289" width="86" height="22" rx="11" fill="#065F46" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
  <text x="953" y="304" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Accepted</text>
  <text x="1060" y="303" fill="#0070F2" font-family="'Inter', sans-serif" font-size="12" font-weight="600">View Details →</text>

  <!-- Row 2 -->
  <line x1="24" y1="371" x2="1176" y2="371" stroke="#334155" stroke-width="0.5" />
  <text x="50" y="351" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">TRV-0004129</text>
  <text x="160" y="351" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="12">070003 (Lufthansa Direct)</text>
  <text x="290" y="351" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">Global Logistics Corp (CUST-0142)</text>
  <text x="450" y="351" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">2025-07-01 → 2025-07-15</text>
  <text x="640" y="351" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">120.00 USD</text>
  <text x="770" y="351" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">4,190.00 USD</text>
