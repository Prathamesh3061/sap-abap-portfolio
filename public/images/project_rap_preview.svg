  <text x="50" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">TRAVEL ID</text>
  <text x="160" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">AGENCY</text>
  <text x="290" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">CUSTOMER</text>
  <text x="450" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">TRAVEL DATES</text>
  <text x="640" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">BOOKING FEE</text>
  <text x="770" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">TOTAL PRICE</text>
  <text x="910" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">STATUS (BDEF)</text>
  <text x="1060" y="260" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ACTION</text>

  <!-- Row 1 (Selected) -->
  <rect x="24" y="275" width="1152" height="48" fill="#1E293B" fill-opacity="0.7" />
  <line x1="24" y1="323" x2="1176" y2="323" stroke="#334155" stroke-width="0.5" />
  <circle cx="36" cy="299" r="6" fill="#0070F2" />
  <text x="50" y="303" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">TRV-0004128</text>
  <text x="160" y="303" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="12">070001 (Fly Emirates)</text>
  <text x="290" y="303" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">Buchanan Travel (CUST-0091)</text>
  <text x="450" y="303" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">2025-06-10 → 2025-06-25</text>
  <text x="640" y="303" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">80.00 EUR</text>
  <text x="770" y="303" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">2,450.00 EUR</text>
