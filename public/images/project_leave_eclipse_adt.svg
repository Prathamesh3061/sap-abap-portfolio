  <!-- ABAP CDS Code in Editor -->
  <g transform="translate(340, 155)" font-family="'JetBrains Mono', monospace" font-size="12">
    <text y="0" fill="#6A9955">@AccessControl.authorizationCheck: #NOT_REQUIRED</text>
    <text y="20" fill="#6A9955">@EndUserText.label: 'Employee Leave Request Root View Entity'</text>
    <text y="40" fill="#6A9955">@UI.headerInfo: { typeName: 'Leave Request', typeNamePlural: 'Leave Requests' }</text>
    <text y="60">
      <tspan fill="#569CD6">define root view entity</tspan> <tspan fill="#4EC9B0">ZI_EmployeeLeave_M</tspan>
    </text>
    <text y="80">
      <tspan fill="#569CD6">as select from</tspan> <tspan fill="#9CDCFE">zemp_leave_req</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#DCDCAA">LeaveReq</tspan>
    </text>
    <text y="100">
      <tspan fill="#C586C0">composition [0..*] of</tspan> <tspan fill="#4EC9B0">ZI_EmployeeLeaveHistory</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#9CDCFE">_History</tspan>
    </text>
    <text y="120">
      <tspan fill="#C586C0">association [1..1] to</tspan> <tspan fill="#4EC9B0">ZI_EmployeeMaster</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#9CDCFE">_Employee</tspan>
    </text>
    <text y="140">
      <tspan fill="#569CD6">on</tspan> <tspan fill="#9CDCFE">$projection.EmployeeID</tspan> = <tspan fill="#9CDCFE">_Employee.EmployeeID</tspan>
    </text>
    <text y="160" fill="#D4D4D4">{</text>
    <text y="180">
      <tspan fill="#569CD6">key</tspan> <tspan fill="#9CDCFE">leave_uuid</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#4EC9B0">LeaveUUID</tspan>,
    </text>
    <text y="200">
      <tspan fill="#9CDCFE">employee_id</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#4EC9B0">EmployeeID</tspan>,
    </text>
    <text y="220">
      <tspan fill="#9CDCFE">leave_type</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#4EC9B0">LeaveType</tspan>, <tspan fill="#6A9955">// Sick, Casual, Annual</tspan>
    </text>
    <text y="240">
      <tspan fill="#9CDCFE">start_date</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#4EC9B0">StartDate</tspan>,
    </text>
    <text y="260">
      <tspan fill="#9CDCFE">end_date</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#4EC9B0">EndDate</tspan>,
    </text>
    <text y="280">
      <tspan fill="#9CDCFE">leave_days</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#4EC9B0">TotalDays</tspan>, <tspan fill="#6A9955">// Auto-calculated via Determination</tspan>
    </text>
    <text y="300">
      <tspan fill="#9CDCFE">approval_status</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#4EC9B0">ApprovalStatus</tspan>, <tspan fill="#6A9955">// Draft, Submitted, Approved, Rejected</tspan>
    </text>
    <text y="320">
      <tspan fill="#9CDCFE">comments</tspan> <tspan fill="#569CD6">as</tspan> <tspan fill="#4EC9B0">Reason</tspan>,
    </text>
    <text y="340">
      <tspan fill="#9CDCFE">_Employee</tspan>, <tspan fill="#9CDCFE">_History</tspan>
    </text>
    <text y="360" fill="#D4D4D4">}</text>
  </g>

