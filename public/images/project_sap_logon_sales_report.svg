<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- SAP GUI classic Blue Crystal / Belize / Quartz header gradients -->
    <linearGradient id="sapLogonHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34495e" />
      <stop offset="100%" stop-color="#2c3e50" />
    </linearGradient>
    <linearGradient id="sapToolbarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecf0f1" />
      <stop offset="100%" stop-color="#bdc3c7" />
    </linearGradient>
    <linearGradient id="sapDarkGui" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="700" rx="12" fill="#0B0F19" />
  <rect x="0.5" y="0.5" width="1199" height="699" rx="11.5" fill="none" stroke="#334155" stroke-width="1" />

  <!-- SAP GUI Title Bar (Authentic SAP Logon Look) -->
  <rect x="0" y="0" width="1200" height="42" fill="url(#sapDarkGui)" />
  <!-- Window buttons -->
  <circle cx="20" cy="21" r="5" fill="#EF4444" />
  <circle cx="36" cy="21" r="5" fill="#F59E0B" />
  <circle cx="52" cy="21" r="5" fill="#10B981" />

  <!-- SAP GUI Window Title -->
  <text x="75" y="26" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">
    SAP Easy Access • [S4H(1)/100] • Program: ZSALES_ORDER_ALV • Transaction: SE38 / ZSO_RPT
  </text>
  <rect x="1030" y="9" width="150" height="24" rx="4" fill="#0070F2" fill-opacity="0.25" stroke="#0070F2" stroke-width="1" />
  <text x="1105" y="25" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">
    SAP GUI 7.70 / 8.0
  </text>

  <!-- SAP Classic Menu Bar -->
  <rect x="0" y="42" width="1200" height="28" fill="#162032" border-bottom="1px solid #334155" />
  <g transform="translate(20, 60)" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">
    <text x="0" y="0" font-weight="600" fill="#38BDF8">Menu</text>
    <text x="50" y="0">Edit</text>
    <text x="90" y="0">Goto</text>
    <text x="135" y="0">Utilities</text>
    <text x="195" y="0">Environment</text>
    <text x="285" y="0" font-weight="600" fill="#FCD34D">System</text>
    <text x="345" y="0">Help</text>
  </g>

  <!-- SAP Standard Command Bar (T-Code Input + Buttons) -->
  <rect x="0" y="70" width="1200" height="40" fill="#1F293D" stroke="#334155" stroke-width="0.8" />
  
  <!-- Green Check (Enter) -->
  <circle cx="35" cy="90" r="12" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
  <text x="35" y="94" fill="#34D399" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✔</text>

  <!-- Transaction Code Input Field -->
  <rect x="60" y="77" width="180" height="26" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1" />
  <text x="70" y="94" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">/nZSO_DISPLAY</text>

  <!-- Save / Back / Exit / Cancel standard buttons -->
  <g transform="translate(260, 80)">
    <!-- Save (Disk) -->
    <rect x="0" y="0" width="30" height="20" rx="3" fill="#334155" />
    <text x="15" y="14" fill="#CBD5E1" font-size="11" text-anchor="middle">💾</text>

    <!-- Back (F3) -->
    <rect x="40" y="0" width="30" height="20" rx="3" fill="#334155" />
    <text x="55" y="14" fill="#FCD34D" font-size="12" font-weight="bold" text-anchor="middle">⮌</text>

    <!-- Exit (Shift+F3) -->
    <rect x="80" y="0" width="30" height="20" rx="3" fill="#334155" />
    <text x="95" y="14" fill="#EF4444" font-size="12" font-weight="bold" text-anchor="middle">✖</text>

    <!-- Cancel (F12) -->
    <rect x="120" y="0" width="30" height="20" rx="3" fill="#334155" />
    <text x="135" y="14" fill="#EF4444" font-size="11" text-anchor="middle">⊘</text>

    <!-- Execute F8 Button (Highlighted in SAP) -->
    <rect x="170" y="-1" width="115" height="22" rx="4" fill="#0070F2" />
    <text x="227" y="14" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ Execute (F8)</text>

    <!-- Debugger Toggle -->
    <rect x="295" y="-1" width="110" height="22" rx="4" fill="#8B5CF6" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="0.8" />
    <text x="350" y="14" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">/h Debugger ON</text>
  </g>

  <!-- Title Ribbon for Selection Screen -->
  <rect x="20" y="122" width="1160" height="34" rx="4" fill="#141E33" />
  <text x="35" y="144" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">
    Sales Order Management Report • Selection Screen
  </text>
  <text x="1050" y="144" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Program: ZSALES_ORDER_ALV</text>

  <!-- SAP GUI Classic Selection Frame (Box with title) -->
  <rect x="20" y="165" width="1160" height="130" rx="6" fill="#0D1527" stroke="#334155" stroke-width="1" />
  <rect x="40" y="157" width="165" height="18" fill="#0D1527" />
  <text x="45" y="170" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">
    Selection Criteria (DDIC)
  </text>

  <!-- SELECT-OPTIONS Row 1: Sales Order Date (S_ERDAT) -->
  <g transform="translate(45, 195)" font-family="'Inter', sans-serif" font-size="12">
    <text x="0" y="15" fill="#E2E8F0" font-weight="500">Sales Order Date (S_ERDAT):</text>
    <rect x="200" y="0" width="140" height="24" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="210" y="16" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">2026-01-01</text>
    <text x="350" y="16" fill="#94A3B8">to</text>
    <rect x="375" y="0" width="140" height="24" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="385" y="16" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">2026-06-30</text>
    <rect x="525" y="0" width="24" height="24" rx="3" fill="#334155" />
    <text x="537" y="16" fill="#38BDF8" font-size="12" text-anchor="middle">➡</text>
  </g>

  <!-- SELECT-OPTIONS Row 2: Plant Filter (S_WERKS) -->
  <g transform="translate(45, 235)" font-family="'Inter', sans-serif" font-size="12">
    <text x="0" y="15" fill="#E2E8F0" font-weight="500">Plant Code (S_WERKS):</text>
    <rect x="200" y="0" width="140" height="24" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="210" y="16" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">1000 (Mumbai Plant)</text>
    <text x="350" y="16" fill="#94A3B8">to</text>
    <rect x="375" y="0" width="140" height="24" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="385" y="16" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">1200 (Pune Plant)</text>
    <rect x="525" y="0" width="24" height="24" rx="3" fill="#334155" />
    <text x="537" y="16" fill="#38BDF8" font-size="12" text-anchor="middle">➡</text>
    <text x="580" y="16" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">
