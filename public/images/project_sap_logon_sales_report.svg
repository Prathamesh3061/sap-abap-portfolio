  <!-- ALV Report Grid Section (Output Display) -->
  <rect x="20" y="310" width="1160" height="355" rx="6" fill="#0D1322" stroke="#1E293B" stroke-width="1" />

  <!-- ALV Toolbar with Sort, Filter, Subtotals, Excel -->
