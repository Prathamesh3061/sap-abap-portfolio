    <text x="80" y="0">SALES ORDER (VBELN)</text>
    <text x="260" y="0">ORDER DATE (ERDAT)</text>
    <text x="430" y="0">PLANT (WERKS)</text>
    <text x="560" y="0">CUSTOMER (KUNNR)</text>
    <text x="770" y="0">NET VALUE (NETWR)</text>
    <text x="930" y="0">CURR</text>
    <text x="1010" y="0">STATUS</text>
  </g>

  <!-- Row 1: Clickable Hotspot -->
  <rect x="20" y="380" width="1160" height="42" fill="#0070F2" fill-opacity="0.12" />
  <line x1="20" y1="422" x2="1180" y2="422" stroke="#1E293B" stroke-width="1" />
  <circle cx="65" cy="401" r="7" fill="#0070F2" />
  <text x="65" y="405" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">➔</text>
  <text x="120" y="406" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-decoration="underline">0005001284</text>
  <text x="300" y="406" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12">2026-05-14</text>
  <text x="470" y="406" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="12">1000 (Mumbai)</text>
  <text x="600" y="406" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">Apex Automotive (CUST-104)</text>
  <text x="810" y="406" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">142,500.00</text>
  <text x="970" y="406" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">INR</text>
  <rect x="1050" y="390" width="80" height="22" rx="11" fill="#065F46" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
  <text x="1090" y="405" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Delivered</text>

  <!-- Row 2 -->
  <line x1="20" y1="464" x2="1180" y2="464" stroke="#1E293B" stroke-width="1" />
  <circle cx="65" cy="443" r="6" fill="#334155" />
  <text x="120" y="448" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-decoration="underline">0005001285</text>
  <text x="300" y="448" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12">2026-05-18</text>
  <text x="470" y="448" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="12">1000 (Mumbai)</text>
  <text x="600" y="448" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">Tata Motors Logistics (CUST-109)</text>
  <text x="810" y="448" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">89,200.00</text>
  <text x="970" y="448" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">INR</text>
  <rect x="1050" y="432" width="80" height="22" rx="11" fill="#854D0E" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1" />
  <text x="1090" y="447" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Open Order</text>

  <!-- Row 3 -->
  <line x1="20" y1="506" x2="1180" y2="506" stroke="#1E293B" stroke-width="1" />
  <circle cx="65" cy="485" r="6" fill="#334155" />
  <text x="120" y="490" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-decoration="underline">0005001286</text>
  <text x="300" y="490" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12">2026-05-22</text>
  <text x="470" y="490" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="12">1200 (Pune)</text>
  <text x="600" y="490" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">Bharat Forge Industrial (CUST-121)</text>
  <text x="810" y="490" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">210,400.00</text>
  <text x="970" y="490" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">INR</text>
  <rect x="1050" y="474" width="80" height="22" rx="11" fill="#065F46" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
  <text x="1090" y="489" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Delivered</text>

  <!-- SAP GUI Status Bar (Bottom Strip) -->
  <rect x="0" y="665" width="1200" height="35" fill="#141E33" stroke="#334155" stroke-width="0.8" />
  <circle cx="25" cy="682" r="5" fill="#10B981" />
  <text x="38" y="686" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600">
    ✔ 34 Sales Orders successfully retrieved from ZSO_HEADER via Open SQL.
  </text>
  <text x="860" y="686" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">
    System: S4H | Client: 100 | User: PSAWANT | Program: ZSALES_ORDER_ALV
  </text>
</svg>
