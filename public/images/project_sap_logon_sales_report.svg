  <text x="40" y="334" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">
    ALV Grid Output: Sales Orders Header (Double-Click VBELN for Items)
  </text>

  <!-- ALV Toolbar Icons -->
  <g transform="translate(740, 318)" font-family="'Inter', sans-serif" font-size="11">
    <rect x="0" y="0" width="65" height="22" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="32" y="15" fill="#CBD5E1" text-anchor="middle">↑ Sort Asc</text>
    
    <rect x="75" y="0" width="65" height="22" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="107" y="15" fill="#CBD5E1" text-anchor="middle">↓ Sort Desc</text>

    <rect x="150" y="0" width="55" height="22" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="177" y="15" fill="#CBD5E1" text-anchor="middle">Filter ⏚</text>

    <rect x="215" y="0" width="85" height="22" rx="3" fill="#0070F2" fill-opacity="0.25" stroke="#0070F2" stroke-width="0.8" />
    <text x="257" y="15" fill="#38BDF8" font-weight="bold" text-anchor="middle">∑ Total Sum</text>

    <rect x="310" y="0" width="95" height="22" rx="3" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="0.8" />
    <text x="357" y="15" fill="#34D399" font-weight="bold" text-anchor="middle">Export ALV</text>
  </g>

  <!-- ALV Column Headers -->
  <line x1="20" y1="348" x2="1180" y2="348" stroke="#334155" stroke-width="1" />
  <g transform="translate(40, 368)" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#94A3B8">
