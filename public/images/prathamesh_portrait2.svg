<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070F2" />
      <stop offset="50%" stop-color="#0c87eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2a16d" />
      <stop offset="100%" stop-color="#c67d48" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0070F2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="32" fill="url(#bgGlow)" />
  
  <!-- Subtle Enterprise Grid Lines -->
  <path d="M 0 150 L 600 150 M 0 300 L 600 300 M 0 450 L 600 450 M 150 0 L 150 600 M 300 0 L 300 600 M 450 0 L 450 600" stroke="#1e293b" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6" />

  <!-- Outer Ambient Ring -->
  <circle cx="300" cy="270" r="195" fill="none" stroke="url(#primaryAccent)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="300" cy="270" r="185" fill="#0b1329" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" />

  <!-- Developer Silhouette / Portrait Representation -->
  <g id="figure" transform="translate(0, 10)">
    <!-- Shoulders & Enterprise Suit -->
    <path d="M 170 540 C 170 420, 230 400, 300 400 C 370 400, 430 420, 430 540 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- White Collared Shirt -->
    <polygon points="265,400 335,400 315,480 285,480" fill="url(#shirtGrad)" />
    <!-- Blue Tie -->
    <polygon points="293,420 307,420 312,500 300,520 288,500" fill="url(#primaryAccent)" />

    <!-- Neck -->
    <rect x="278" y="340" width="44" height="70" rx="6" fill="url(#skinGrad)" />
    
    <!-- Face / Head Base -->
    <ellipse cx="300" cy="260" rx="68" ry="85" fill="url(#skinGrad)" />
    
    <!-- Ears -->
    <ellipse cx="230" cy="265" rx="12" ry="20" fill="url(#skinGrad)" />
    <ellipse cx="370" cy="265" rx="12" ry="20" fill="url(#skinGrad)" />

    <!-- Professional Hair -->
    <path d="M 228 245 C 228 175, 260 160, 300 160 C 345 160, 372 175, 372 245 C 360 215, 340 210, 300 210 C 260 210, 238 220, 228 245 Z" fill="url(#hairGrad)" />

    <!-- Eyebrows -->
    <path d="M 255 240 Q 275 233 290 240" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 310 240 Q 325 233 345 240" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Glasses (Sharp technical look) -->
    <rect x="245" y="246" width="46" height="30" rx="6" fill="#0f172a" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2.5" />
    <rect x="309" y="246" width="46" height="30" rx="6" fill="#0f172a" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 291 258 L 309 258" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 245 255 L 232 250" stroke="#38bdf8" stroke-width="2" />
    <path d="M 355 255 L 368 250" stroke="#38bdf8" stroke-width="2" />

    <!-- Eyes -->
    <circle cx="268" cy="261" r="5" fill="#1e293b" />
    <circle cx="270" cy="259" r="2" fill="#ffffff" />
    <circle cx="332" cy="261" r="5" fill="#1e293b" />
    <circle cx="334" cy="259" r="2" fill="#ffffff" />

    <!-- Nose -->
    <path d="M 300 262 L 297 285 L 306 285" stroke="#944414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Confident Smile -->
    <path d="M 282 305 Q 300 320 318 305" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Badges representing exact resume stack -->
  <!-- Badge 1: SAP Certified Associate ABAP Cloud -->
  <g transform="translate(45, 105)" filter="url(#cardShadow)">
    <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="22" cy="21" r="9" fill="#F59E0B" />
    <text x="22" y="25" fill="#000000" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="900" text-anchor="middle">★</text>
    <text x="38" y="26" fill="#FCD34D" font-size="11" font-family="'Inter', sans-serif" font-weight="700">SAP ABAP Cloud Cert</text>
  </g>

  <!-- Badge 2: Eclipse ADT & RAP -->
  <g transform="translate(385, 115)" filter="url(#cardShadow)">
    <rect width="165" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="22" cy="21" r="8" fill="#0070F2" />
    <text x="22" y="25" fill="#ffffff" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">ADT</text>
    <text x="38" y="26" fill="#f8fafc" font-size="12" font-family="'Inter', sans-serif" font-weight="600">Eclipse ADT &amp; RAP</text>
  </g>

  <!-- Badge 3: SAP Logon & Core ABAP -->
  <g transform="translate(55, 435)" filter="url(#cardShadow)">
    <rect width="160" height="42" rx="10" fill="#0f172a" stroke="#0070F2" stroke-width="1.5" />
    <circle cx="22" cy="21" r="8" fill="#0070F2" />
    <text x="22" y="25" fill="#ffffff" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">GUI</text>
    <text x="38" y="26" fill="#f8fafc" font-size="12" font-family="'Inter', sans-serif" font-weight="600">SAP Logon &amp; ALV</text>
  </g>

  <!-- Badge 4: PVPIT CSE '25 -->
  <g transform="translate(385, 435)" filter="url(#cardShadow)">
    <rect width="160" height="42" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="22" cy="21" r="7" fill="#10b981" />
    <text x="36" y="26" fill="#f8fafc" font-size="12" font-family="'Inter', sans-serif" font-weight="600">B.Tech CSE '25 (PVPIT)</text>
  </g>

  <!-- Bottom Name Banner -->
  <rect x="135" y="535" width="330" height="42" rx="21" fill="#020617" stroke="#334155" stroke-width="1" />
  <circle cx="158" cy="556" r="5" fill="#10b981" />
  <text x="172" y="560" fill="#94a3b8" font-size="13" font-family="'Inter', sans-serif" font-weight="500">Prathamesh Sawant • <tspan fill="#38bdf8">SAP ABAP Developer</tspan></text>
</svg>
